[project]
name = "kiwoom-mac-trading-api"
version = "0.21.0"
description = "Mac용 키움 REST API 기반 미국주식 수동매매 API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.0",
  "kwcli>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
